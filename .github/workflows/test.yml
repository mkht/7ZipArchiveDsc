name: 7ZipArchiveDsc

on: [push]

jobs:
  Tests_PowerShell_5:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v7

      - name: Install Pester 6
        run: Install-Module Pester -RequiredVersion 6.2.0 -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Configure WinRM
        run: winrm quickconfig -quiet

      - name: Collect environment
        run: |
          $PSVersionTable
          Get-ChildItem 'env:' | Format-Table -AutoSize -Wrap

      - name: Unit Tests
        run: |
          Import-Module Pester -RequiredVersion 6.2.0
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './Tests/Unit'
          $configuration.Run.Exit = $true
          $configuration.Filter.Tag = 'Unit'
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration

      - name: Integration Tests
        run: |
          Import-Module Pester -RequiredVersion 6.2.0
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './Tests/Integration'
          $configuration.Run.Exit = $true
          $configuration.Filter.Tag = 'Integration'
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration

  Tests_PowerShell_7:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - name: Install Pester 6
        run: Install-Module Pester -RequiredVersion 6.2.0 -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Install PSDesiredStateConfiguration
        run: Install-Module PSDesiredStateConfiguration -Repository PSGallery -MaximumVersion 2.99 -Force -AllowClobber

      - name: Configure WinRM
        run: winrm quickconfig -quiet

      - name: Collect environment
        run: |
          $PSVersionTable
          Get-ChildItem 'env:' | Format-Table -AutoSize -Wrap
          Get-Module -ListAvailable

      - name: Unit Tests
        run: |
          Import-Module Pester -RequiredVersion 6.2.0
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './Tests/Unit'
          $configuration.Run.Exit = $true
          $configuration.Filter.Tag = 'Unit'
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration

      - name: Integration Tests
        run: |
          Import-Module Pester -RequiredVersion 6.2.0
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './Tests/Integration'
          $configuration.Run.Exit = $true
          $configuration.Filter.Tag = 'Integration'
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration
